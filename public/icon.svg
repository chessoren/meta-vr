<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Loci">
  <!-- Loci app icon: a small warm flame inside an arched doorway (the memory palace).
       Content stays inside the 80 % maskable safe zone. PNG export: see README.md → "Icons". -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="62%" r="70%">
      <stop offset="0" stop-color="#3a2415"/>
      <stop offset="0.55" stop-color="#1f140c"/>
      <stop offset="1" stop-color="#140d08"/>
    </radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120b06"/>
      <stop offset="1" stop-color="#2b190c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="72%" r="55%">
      <stop offset="0" stop-color="#f2b24a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e07a2e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e07a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d58a"/>
      <stop offset="1" stop-color="#b9832f"/>
    </linearGradient>
    <linearGradient id="outer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9582a"/>
      <stop offset="0.55" stop-color="#ef8a3a"/>
      <stop offset="1" stop-color="#f6b54c"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="1" stop-color="#f6d354"/>
    </linearGradient>
    <clipPath id="arch"><path d="M160 408V252a96 96 0 0 1 192 0v156z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M160 408V252a96 96 0 0 1 192 0v156z" fill="url(#door)"/>
  <g clip-path="url(#arch)">
    <ellipse cx="256" cy="336" rx="150" ry="130" fill="url(#halo)"/>
    <ellipse cx="256" cy="400" rx="70" ry="10" fill="#f2b24a" opacity="0.25"/>
  </g>
  <path d="M160 408V252a96 96 0 0 1 192 0v156" fill="none" stroke="url(#rim)" stroke-width="13" stroke-linecap="round"/>
  <path d="M136 408h240" stroke="#c28a35" stroke-width="13" stroke-linecap="round"/>
  <!-- flame -->
  <path d="M262 206c10 30 46 58 46 106 0 34-23 60-52 60s-52-24-52-58c0-26 14-44 26-58 4 16 12 26 22 30-6-30 0-58 10-80z" fill="url(#outer)"/>
  <path d="M257 272c6 18 25 32 25 56 0 18-11 30-26 30s-25-12-25-28c0-14 8-24 14-30 2 8 6 12 10 14-2-16 0-30 2-42z" fill="url(#inner)"/>
</svg>
